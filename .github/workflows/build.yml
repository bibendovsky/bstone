name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
          - name: Windows (MSVC)
            os: windows-latest
          - name: macOS (Clang)
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The bundled SDL3 is built from source, so its Linux backends need the
      # usual X11/Wayland/audio/GL development headers.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libwayland-egl-backend-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev

      - name: Configure
        run: cmake -S . -B build -DBSTONE_SDL_BUNDLED=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target bstone --parallel
